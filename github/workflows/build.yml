name: Build Ghost Browser

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build || echo "no build yet"
      - run: npm run dist:win || npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Ghost-Browser-Windows
          path: dist/*
